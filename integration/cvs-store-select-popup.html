<!DOCTYPE html>
<!--/*
  調査対象店舗選択ウィジェットの Thymeleaf フラグメント。
  社内アプリでは src/main/resources/templates/fragments/ に置く想定。

  ● storeSelectPopup … jQuery UI の $().dialog() で開く「調査対象店舗選択」の中身。
    タイトルバー・OK/キャンセル・暗幕は jQuery UI が生成する。ルート要素の title 属性が
    ダイアログ見出しになる（open() 呼び出し時に title / width を引数で上書きも可能）。

  ● favoriteEditFields … 「お気に入り店舗名 × 最大10件」の入力欄セクション。
    単独ダイアログではなく、社内アプリ側の既存ダイアログの中身テンプレートへ埋め込んで使う。
    JS 側: CvsStoreWidget.FavoriteEdit.mount() で行を生成し、ホストダイアログの
    open で load()、OK で save()、close で reset() を呼ぶ（詳細は README.md）。

  使い方（ホスト画面側）:
    <div th:replace="~{fragments/cvs-store-select-popup :: storeSelectPopup}"></div>
    ...既存ダイアログの中身テンプレート内...
      <div th:replace="~{fragments/cvs-store-select-popup :: favoriteEditFields}"></div>

  ・jQuery UI（dialog を含むビルド）を読み込んでおくこと。
  ・storeSelectPopup は dialog 初期化時に jQuery UI が中身を <body> 直下へ移動するので
    置き場所はほぼ問わない（ただし <template> の中は不可）。
  ・スタイルは cvs-store-widget.layout.css（構造）→ cvs-store-widget.theme.css（外観）の順。
    これらは「中身」だけをスタイルする。ダイアログの枠は jQuery UI テーマの担当。
  ・スクリプトの読み込み順と CvsStoreWidget.config.contextPath の設定は README.md 参照。

  この html/head/body スケルトンはフラグメント解決時には描画されない（整形式のための入れ物）。
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head><meta charset="UTF-8"><title>cvs-store-select dialog fragments</title></head>
<body>

<!-- 調査対象店舗選択ダイアログ（中身のみ。枠は jQuery UI が生成） -->
<div th:fragment="storeSelectPopup" id="storeSelectDialog" class="cvs-store-widget" title="店舗選択" style="display:none;">
  <div class="cvs-form-row">
    <label>お気に入り店舗</label>
    <div id="favoritesList" class="cvs-favorites-list"></div>
    <p id="favoritesEmptyMessage" class="cvs-hint" style="display:none;">お気に入り店舗が登録されていません。</p>
  </div>

  <div class="cvs-form-row">
    <label for="storeNameInput">店舗名 <span class="cvs-required">必須</span></label>
    <div class="cvs-autocomplete-wrapper">
      <input type="text" id="storeNameInput" autocomplete="off" placeholder="店舗名を入力してください">
      <ul id="suggestList" class="cvs-suggest-list" style="display:none;"></ul>
    </div>
    <input type="hidden" id="selectedStoreId" value="">
    <p id="newStoreHint" class="cvs-hint" style="display:none;">店舗マスタに未登録の店舗として扱われます。「OK」を押すと新規店舗として登録するか確認します。</p>
  </div>

  <div class="cvs-form-row">
    <label for="chainSelect">チェーン名 <span class="cvs-required">必須</span></label>
    <select id="chainSelect"><option value="">選択してください</option></select>
  </div>

  <div class="cvs-form-row">
    <label for="locationSelect">立地条件 <span class="cvs-required">必須</span></label>
    <select id="locationSelect"><option value="">選択してください</option></select>
  </div>

  <div class="cvs-form-row">
    <label for="prefectureSelect">都道府県 <span class="cvs-required">必須</span></label>
    <select id="prefectureSelect"><option value="">選択してください</option></select>
  </div>

  <p id="formErrorMessage" class="cvs-error-message" style="display:none;"></p>
</div>

<!-- お気に入り店舗名の入力欄セクション（ホストの既存ダイアログの中身へ th:replace で埋め込む） -->
<div th:fragment="favoriteEditFields" class="cvs-store-widget">
  <p class="cvs-hint">お気に入り店舗名： </p>
  <div data-cvs-favorite-edit-rows></div>
</div>

</body>
</html>
